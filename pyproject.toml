# 이건 기능 구현이라기보단 프로젝트 환경 설명서에 가까움
# 이 프로젝트를 실행하려면 이런 기술들이 필요하다~ 라고 정의하는 파일

[project]
name = "rag-project"
version = "0.1.0"
description = "LangGraph-based RAG chatbot for Korean financial products"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "openai>=2.51.0",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
